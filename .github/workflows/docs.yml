name: docs

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'prompts/**'
  workflow_dispatch:

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run repository contract checks
        run: |
          bash -n scripts/*.sh
          python3 scripts/repo_check.py
